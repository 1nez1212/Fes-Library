<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="nav__container">
          <img class="logo" src="./Library.svg" alt="Library logo" />
          <ul class="nav__links">
            <li><a href="#" class="nav__link">Home</a></li>
            <li><a hef="#" class="nav__link">Contact</a></li>
            <li><a href="#" class="nav__link">Books</a></li>
          </ul>
        </div>
      </nav>
      <header>
        <div class="header__container">
          <div class="header__description">
          <h1>America's most awarded online library</h1>
          <h2>Find the book that fits your mood with <span class="Brown">Library</span></h2>
        </div>
        <figure class="header__img--wrapper">
         <img src="./Undraw_Books.svg" alt="">
        </figure>
      </div>
      </header>
    </section>

    <main>
      <section id="highlights">
        <div class="container">
          <div class="row">
            <h2 class="section__title">
              Why read <span class="Brown">Library</span>
            </h2>
            <div class="highlight__wrapper">
              <div class="highlight">
               <div class="highlight__img">
                <i class="fas fa-bolt"></i>
               </div>
                <h3 class="highlight__subtitle">
                  Fast & Swift
                </h3>
                <p class="highlight__para">
                  Get access to your book of interest
                </p>
              </div>
              <div class="highlight">
               <div class="highlight__img">
                <i class="fas fa-book-open"></i>
               </div>
                <h3 class="highlight__subtitle">
                  10,000+ books
                </h3>
                <p class="highlight__para">
                  Get access to your book of interest
                </p>
              </div>
              <div class="highlight">
               <div class="highlight__img">
                <i class="fas fa-tags"></i>
               </div>
                <h3 class="highlight__subtitle">
                  Afforable
                </h3>
                <p class="highlight__para">
                  Get access to your book of interest
                </p>
              </div>
           </div>
          </div>
        </section>


        <section id="features">
          <div class="container">
            <div class="row">
            </div>
          </div>
        </section>

        <section id="recent">
          <div class="container">
            <div class="row">
            </div>
          </div>
        </section>
      </main>
  </body>

</html>
